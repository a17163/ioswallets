			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\n# 预置框架被以 folder reference 的方式直接拷进 <App>.app/Frameworks/，\n# Xcode 不会重签它们；而它们的原始签名在二进制/Info.plist 被修改后已经失效，\n# iOS 因此会拒绝安装（0xE8008001）和 dlopen。这里统一处理：\n#   1) 清掉不该进包的逆向分析残留（.bak/.til/_*.bin/脚本/__pycache__）\n#   2) 用本次构建的签名身份重签两个 framework\n\nFW_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Frameworks\"\nif [ ! -d \"${FW_DIR}\" ]; then\n  exit 0\nfi\n\nfind \"${FW_DIR}\" -maxdepth 1 -type f \\( -name '*.bak' -o -name '*.til' -o -name '_*' -o -name '*.py' \\) -delete\nfind \"${FW_DIR}\" -maxdepth 2 -type d -name '__pycache__' -prune -exec rm -rf {} +\n\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  for fw in \"${FW_DIR}\"/*.framework; do\n    [ -d \"${fw}\" ] || continue\n    /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --timestamp=none \"${fw}\"\n  done\nfi\n";
		};
